<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমানাহ অনলাইন শপ — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#18212b}header{background:#087443;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px;margin:0}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:#087443;color:#fff}.danger{background:#fff;color:#b42318}.light{background:#eef2f4}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e1e6ea;border-radius:16px;padding:20px;margin-bottom:16px}.login{max-width:520px;margin:70px auto}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid #ccd4da;border-radius:10px;font:inherit}textarea{min-height:90px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#fdecec;color:#9b1c1c}.ok{background:#eaf8ef;color:#176b3a}.hidden{display:none!important}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#fff;border:1px solid #d7dee3;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.tab.active{background:#087443;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat{padding:18px;border:1px solid #e1e6ea;border-radius:14px;background:#fff}.stat b{font-size:28px;display:block}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8ecef;text-align:left}th{background:#f7f9fa}@media(max-width:650px){header h1{font-size:16px}.wrap{margin:12px auto}.card{padding:14px}}
</style></head>
<body>
<header><h1>আমানাহ অনলাইন শপ — Admin Panel</h1><button id="logout" class="btn danger hidden">Logout</button></header>
<main class="wrap">
<section id="login" class="card login"><h2>Admin Login</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary" style="margin-top:14px">Login</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden">
<nav><button class="tab active" data-page="dashboard">Dashboard</button><button class="tab" data-page="products">Products</button><button class="tab" data-page="categories">Categories</button><button class="tab" data-page="orders">Orders</button></nav>
<div id="dashboard"><div class="grid"><div class="stat">Products<b id="np">0</b></div><div class="stat">Categories<b id="nc">0</b></div><div class="stat">Orders<b id="no">0</b></div></div></div>
<div id="products" class="hidden"><div class="card"><h2>Add Product</h2><label>Name</label><input id="pn"><label>Price</label><input id="pp" type="number" step="0.01"><label>Stock</label><input id="ps" type="number" value="0"><label>Description</label><textarea id="pd"></textarea><button id="addP" class="btn primary" style="margin-top:12px">Add Product</button><div id="pm" class="msg hidden"></div></div><div class="card"><h2>Products</h2><div id="pl">Loading…</div></div></div>
<div id="categories" class="hidden"><div class="card"><h2>Add Category</h2><label>Name</label><input id="cn"><button id="addC" class="btn primary" style="margin-top:12px">Add Category</button><div id="cm" class="msg hidden"></div></div><div class="card"><h2>Categories</h2><div id="cl">Loading…</div></div></div>
<div id="orders" class="hidden"><div class="card"><h2>Orders</h2><div id="ol">Loading…</div></div></div>
</section></main>
<script>
const supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);
function message(el,text,ok=false){el.textContent=text;el.classList.remove('hidden');el.className='msg'+(ok?' ok':'')}
async function isAdmin(user){const {data,error}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;return data&&(data.role==='admin'||data.role==='staff')}
async function showState(){const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;const user=data.session?.user;if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}if(!(await isAdmin(user))){await supabaseClient.auth.signOut();$('login').classList.remove('hidden');$('app').classList.add('hidden');message($('loginMsg'),'এই account-এর admin/staff permission নেই।');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await loadAll()}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message($('loginMsg'),'Email এবং password দিন।');return}$('loginBtn').disabled=true;try{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await showState()}catch(e){message($('loginMsg'),e.message||'Login failed')}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await supabaseClient.auth.signOut();await showState()};
supabaseClient.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')showState()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','products','categories','orders'].forEach(id=>$(id).classList.add('hidden'));$(b.dataset.page).classList.remove('hidden')});
async function loadAll(){const [p,c,o]=await Promise.all([supabaseClient.from('products').select('*').order('created_at',{ascending:false}),supabaseClient.from('categories').select('*').order('created_at',{ascending:false}),supabaseClient.from('orders').select('*').order('created_at',{ascending:false})]);if(p.error)throw p.error;if(c.error)throw c.error;if(o.error)throw o.error;$('np').textContent=p.data.length;$('nc').textContent=c.data.length;$('no').textContent=o.data.length;renderProducts(p.data);renderCategories(c.data);renderOrders(o.data)}
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function renderProducts(a){$('pl').innerHTML=a.length?'<table><tr><th>Name</th><th>Price</th><th>Stock</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.price??0}</td><td>${x.stock??0}</td></tr>`).join('')+'</table>':'কোনো product নেই।'}
function renderCategories(a){$('cl').innerHTML=a.length?'<table><tr><th>Name</th><th>Slug</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.slug||'')}</td></tr>`).join('')+'</table>':'কোনো category নেই।'}
function renderOrders(a){$('ol').innerHTML=a.length?'<table><tr><th>Order</th><th>Total</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${esc(x.id)}</td><td>${x.total_amount??0}</td><td>${esc(x.status||'pending')}</td></tr>`).join('')+'</table>':'কোনো order নেই।'}
$('addP').onclick=async()=>{const name=$('pn').value.trim(),price=Number($('pp').value),stock=Number($('ps').value)||0;if(!name||Number.isNaN(price)){message($('pm'),'Name এবং valid price দিন।');return}const {error}=await supabaseClient.from('products').insert({name,price,stock,description:$('pd').value.trim()||null});if(error){message($('pm'),error.message);return}message($('pm'),'Product যোগ হয়েছে।',true);$('pn').value='';$('pp').value='';$('ps').value='0';$('pd').value='';await loadAll()};
$('addC').onclick=async()=>{const name=$('cn').value.trim();if(!name){message($('cm'),'Category name দিন।');return}const {error}=await supabaseClient.from('categories').insert({name,slug:name.toLowerCase().replace(/\s+/g,'-')});if(error){message($('cm'),error.message);return}message($('cm'),'Category যোগ হয়েছে।',true);$('cn').value='';await loadAll()};
showState().catch(e=>message($('loginMsg'),'Dashboard load হয়নি: '+e.message));
</script></body></html>
