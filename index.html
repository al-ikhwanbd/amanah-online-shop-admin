<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমানাহ অনলাইন শপ — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f4f6f8;color:#18212b}header{background:#087443;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid #e1e6ea;border-radius:15px;padding:18px;margin-bottom:15px}.login{max-width:500px;margin:60px auto}.hidden{display:none!important}label{display:block;margin:12px 0 6px;font-weight:650}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4da;border-radius:9px;font:inherit;background:white}textarea{min-height:75px}.btn,.tab{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:650}.primary,.active{background:#087443;color:#fff}.light,.tab{background:#fff;border:1px solid #d7dee3}.danger{background:#fff;color:#a21d1d}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#fff;border:1px solid #e1e6ea;border-radius:14px;padding:16px}.stat b{display:block;font-size:27px}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8ecef;vertical-align:middle}th{background:#f7f9fa}.tablewrap{overflow:auto}.msg{padding:10px;margin-top:10px;border-radius:8px;background:#fdecec;color:#9b1c1c;overflow-wrap:anywhere}.ok{background:#eaf8ef;color:#176b3a}.muted{color:#58636d;font-size:13px}img.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px}button:disabled{opacity:.6}@media(max-width:600px){h1{font-size:16px}.card{padding:13px}.wrap{margin:12px auto}}
</style></head>
<body>
<header><h1>আমানাহ অনলাইন শপ — Admin Panel</h1><button id="logout" class="btn danger hidden">Logout</button></header>
<main class="wrap">
<section id="login" class="card login"><h2>Admin Login</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary" style="margin-top:14px">Login</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden">
<nav class="nav"><button class="tab active" data-page="dashboard">Dashboard</button><button class="tab" data-page="products">Products</button><button class="tab" data-page="categories">Categories</button><button class="tab" data-page="orders">Orders</button></nav>
<section id="dashboard"><div class="grid"><div class="stat">Products<b id="np">0</b></div><div class="stat">Categories<b id="nc">0</b></div><div class="stat">Orders<b id="no">0</b></div></div></section>
<section id="products" class="hidden"><div class="card"><h2>পণ্য যোগ করুন</h2><label>পণ্যের নাম *</label><input id="pn" required><label>ক্যাটাগরি</label><select id="pc"><option value="">ক্যাটাগরি বাছাই করুন</option></select><label>মূল্য *</label><input id="pp" type="number" min="0" step="0.01" required><label>স্টক</label><input id="ps" type="number" min="0" value="0"><label>বিবরণ</label><textarea id="pd"></textarea><label>পণ্যের ছবি (ঐচ্ছিক)</label><input id="pi" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><p class="muted">JPG, PNG, WebP বা GIF; সর্বোচ্চ 5 MB।</p><div id="preview"></div><button id="addP" class="btn primary" style="margin-top:12px">পণ্য যোগ করুন</button><div id="pm" class="msg hidden"></div></div><div class="card"><h2>পণ্যের তালিকা</h2><div id="pl" class="tablewrap">লোড হচ্ছে…</div></div></section>
<section id="categories" class="hidden"><div class="card"><h2>ক্যাটাগরি যোগ করুন</h2><label>ক্যাটাগরির নাম</label><input id="cn"><button id="addC" class="btn primary" style="margin-top:12px">ক্যাটাগরি যোগ করুন</button><div id="cm" class="msg hidden"></div></div><div class="card"><h2>ক্যাটাগরির তালিকা</h2><div id="cl" class="tablewrap">লোড হচ্ছে…</div></div></section>
<section id="orders" class="hidden"><div class="card"><h2>অর্ডার</h2><div id="ol" class="tablewrap">লোড হচ্ছে…</div></div></section>
</section></main>
<script>
const $=id=>document.getElementById(id);
const supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function message(el,text,ok=false){el.textContent=text;el.className='msg'+(ok?' ok':'');}
async function isAdmin(user){const {data,error}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;return !!data&&['admin','staff'].includes(data.role)}
async function showState(){const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;const user=data.session?.user;if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}if(!(await isAdmin(user))){$('login').classList.remove('hidden');$('app').classList.add('hidden');message($('loginMsg'),'এই account-এর admin/staff permission নেই।');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');try{await loadAll()}catch(e){message($('loginMsg'),'ডেটা লোড হয়নি: '+e.message)}}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message($('loginMsg'),'ইমেইল ও পাসওয়ার্ড দিন।');return}$('loginBtn').disabled=true;try{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await showState()}catch(e){message($('loginMsg'),e.message||'Login failed')}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['dashboard','products','categories','orders'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.page))});
async function loadAll(){const [p,c,o]=await Promise.all([supabaseClient.from('products').select('*').order('created_at',{ascending:false}),supabaseClient.from('categories').select('*').order('created_at',{ascending:false}),supabaseClient.from('orders').select('*').order('created_at',{ascending:false})]);for(const r of [p,c,o])if(r.error)throw r.error;$('np').textContent=p.data.length;$('nc').textContent=c.data.length;$('no').textContent=o.data.length;renderProducts(p.data);renderCategories(c.data);renderOrders(o.data);$('pc').innerHTML='<option value="">ক্যাটাগরি বাছাই করুন</option>'+c.data.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
function renderProducts(a){$('pl').innerHTML=a.length?'<table><tr><th>ছবি</th><th>নাম</th><th>মূল্য</th><th>স্টক</th><th>ক্যাটাগরি ID</th></tr>'+a.map(x=>`<tr><td>${x.image_url?`<img class="thumb" src="${esc(x.image_url)}" alt="">`:'—'}</td><td>${esc(x.name)}</td><td>${esc(x.price)}</td><td>${esc(x.stock)}</td><td>${esc(x.category_id||'—')}</td></tr>`).join('')+'</table>':'কোনো পণ্য নেই।'}
function renderCategories(a){$('cl').innerHTML=a.length?'<table><tr><th>নাম</th><th>Slug</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.slug||'')}</td></tr>`).join('')+'</table>':'কোনো ক্যাটাগরি নেই।'}
function renderOrders(a){$('ol').innerHTML=a.length?'<table><tr><th>অর্ডার</th><th>গ্রাহক</th><th>ফোন</th><th>মোট</th><th>স্ট্যাটাস</th><th>তারিখ</th></tr>'+a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.total)}</td><td>${esc(x.status)}</td><td>${esc(x.created_at?new Date(x.created_at).toLocaleString('bn-BD'):'')}</td></tr>`).join('')+'</table>':'কোনো অর্ডার নেই।'}
$('pi').onchange=()=>{const f=$('pi').files[0];$('preview').innerHTML='';if(f){const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='ছবির প্রিভিউ';img.style='max-width:150px;max-height:150px;margin-top:8px;border-radius:8px';$('preview').appendChild(img)}};
$('addP').onclick=async()=>{const name=$('pn').value.trim(),price=Number($('pp').value),stock=Number($('ps').value)||0,file=$('pi').files[0],category_id=$('pc').value;if(!name||$('pp').value===''||!Number.isFinite(price)||price<0||stock<0){message($('pm'),'পণ্যের নাম, সঠিক মূল্য ও স্টক দিন।');return}if(file&&(!file.type.startsWith('image/')||file.size>5*1024*1024)){message($('pm'),'ছবি JPG/PNG/WebP/GIF হতে হবে এবং 5 MB-এর কম হতে হবে।');return}const btn=$('addP');btn.disabled=true;try{let image_url=null;if(file){const path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:upErr}=await supabaseClient.storage.from('product-images').upload(path,file,{contentType:file.type});if(upErr)throw new Error('ছবি আপলোড হয়নি: '+upErr.message);image_url=supabaseClient.storage.from('product-images').getPublicUrl(path).data.publicUrl}const {error}=await supabaseClient.from('products').insert({name,price,stock,category_id:category_id||null,description:$('pd').value.trim()||null,image_url});if(error)throw error;message($('pm'),'পণ্য যোগ হয়েছে।',true);$('pn').value='';$('pp').value='';$('ps').value='0';$('pd').value='';$('pi').value='';$('preview').innerHTML='';await loadAll()}catch(e){message($('pm'),e.message||'পণ্য যোগ করা যায়নি।')}finally{btn.disabled=false}};
$('addC').onclick=async()=>{const name=$('cn').value.trim();if(!name){message($('cm'),'ক্যাটাগরির নাম দিন।');return}const {error}=await supabaseClient.from('categories').insert({name,slug:name});if(error){message($('cm'),error.message);return}message($('cm'),'ক্যাটাগরি যোগ হয়েছে।',true);$('cn').value='';try{await loadAll()}catch(e){message($('cm'),e.message)}};
showState().catch(e=>message($('loginMsg'),'Dashboard load হয়নি: '+e.message));
</script></body></html>
