<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমানাহ — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f5f7fa;color:#18212f}.top{background:#146c43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #d8dee6;border-radius:9px;margin:5px 0 10px}button{padding:11px 15px;border:0;border-radius:9px;background:#146c43;color:#fff;font-weight:800;cursor:pointer}.danger{background:#b42318}.row{display:grid;grid-template-columns:65px 1fr 100px 100px;gap:10px;align-items:center;border-top:1px solid #eee;padding:10px 0}.thumb{width:60px;height:60px;object-fit:cover;border-radius:9px;background:#eee}.hidden{display:none}.muted{color:#667085;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:55px 1fr auto}}
</style></head><body><div class="top"><div class="wrap"><b>আমানাহ অনলাইন শপ — Admin Panel</b><button style="float:right;background:#fff;color:#146c43" onclick="logout()">Logout</button></div></div>
<div class="wrap">
<section id="login" class="panel"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" class="muted"></p></section>
<div id="app" class="hidden"><section class="panel"><h2>পণ্য যোগ করুন</h2><div class="grid"><div><label>নাম</label><input id="name"></div><div><label>দাম</label><input id="price" type="number"></div><div><label>স্টক</label><input id="stock" type="number"></div><div><label>ক্যাটাগরি</label><input id="cat"></div><div><label>ছবি</label><input id="file" type="file" accept="image/*"></div><div><label>বিবরণ</label><textarea id="desc"></textarea></div></div><button onclick="addProduct()">পণ্য সংরক্ষণ</button></section>
<section class="panel"><h2>পণ্যসমূহ</h2><div id="products"></div></section>
<section class="panel"><h2>অর্ডারসমূহ</h2><div id="orders"></div></section></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function check(){let {data:{session}}=await sb.auth.getSession();if(session){login.style.display='none';app.classList.remove('hidden');load()}}
window.login=async()=>{let {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});msg.textContent=error?error.message:'';if(!error){login.style.display='none';app.classList.remove('hidden');load()}};
window.logout=async()=>{await sb.auth.signOut();location.reload()};
async function load(){let p=await sb.from('products').select('*,categories(name)').order('created_at',{ascending:false});products.innerHTML=(p.data||[]).map(x=>`<div class="row"><img class="thumb" src="${x.image_url||'../shop/assets/logo-placeholder.svg'}"><div><b>${x.name}</b><div class="muted">৳${x.price} · stock ${x.stock}</div></div><button onclick="toggle('${x.id}',${x.is_active})">${x.is_active?'Hide':'Show'}</button><button class="danger" onclick="del('${x.id}')">Delete</button></div>`).join('');let o=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});orders.innerHTML=(o.data||[]).map(x=>`<div class="row" style="grid-template-columns:1fr 130px"><div><b>${x.customer_name}</b> · ${x.phone}<div>${x.address}</div><div>৳${x.total} · ${x.order_items?.map(i=>i.product_name+' × '+i.quantity).join(', ')}</div></div><select onchange="status('${x.id}',this.value)"><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='confirmed'?'selected':''}>confirmed</option><option ${x.status==='processing'?'selected':''}>processing</option><option ${x.status==='shipped'?'selected':''}>shipped</option><option ${x.status==='delivered'?'selected':''}>delivered</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')}
window.addProduct=async()=>{let {data:c}=await sb.from('categories').select('id').eq('name',cat.value).maybeSingle();let cid=c?.id;if(!cid){let n=await sb.from('categories').insert({name:cat.value||'সাধারণ'}).select().single();cid=n.data?.id}let url=null;if(file.files[0]){let f=file.files[0],path='products/'+crypto.randomUUID()+'-'+f.name;let u=await sb.storage.from('product-images').upload(path,f);if(u.error)return alert(u.error.message);url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}let r=await sb.from('products').insert({name:name.value,price:Number(price.value),stock:Number(stock.value||0),category_id:cid,description:desc.value,image_url:url}).select();if(r.error)alert(r.error.message);else{alert('সংরক্ষণ হয়েছে');location.reload()}};
window.del=async id=>{if(confirm('মুছবেন?')){await sb.from('products').delete().eq('id',id);load()}};window.toggle=async(id,v)=>{await sb.from('products').update({is_active:!v}).eq('id',id);load()};window.status=async(id,v)=>{await sb.from('orders').update({status:v}).eq('id',id);load()};check();
</script></body></html>
